<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17211b" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>Trail Water</title>
</head>
<body>
  <div id="map" aria-label="Hiking map"></div>

  <header class="bar">
    <h1>Trail Water</h1>
    <span id="net" class="net" hidden>Offline</span>
    <button id="offline-btn" type="button">Save offline area</button>
    <button id="auth-btn" type="button">Sign in</button>
  </header>

  <details class="legend">
    <summary>Water key</summary>
    <ul>
      <li><i data-status="flowing"></i>Flowing</li>
      <li><i data-status="trickling"></i>Trickling</li>
      <li><i data-status="pooled"></i>Standing pools</li>
      <li><i data-status="dry"></i>Dry</li>
      <li><i data-status="unknown"></i>No report in 30 days</li>
    </ul>
  </details>

  <aside id="sheet" hidden aria-live="polite"></aside>
  <div id="toast" role="status" hidden></div>

  <dialog id="auth-dialog">
    <form method="dialog" id="auth-form">
      <h2>Sign in to post reports</h2>
      <p>We email you a sign-in link. No password.</p>
      <label>Email <input id="auth-email" type="email" required autocomplete="email" /></label>
      <div class="row">
        <button value="cancel" type="button" id="auth-cancel">Cancel</button>
        <button type="submit" class="primary">Send link</button>
      </div>
    </form>
  </dialog>

  <dialog id="offline-dialog">
    <h2>Save offline area</h2>
    <p id="offline-text"></p>
    <progress id="offline-progress" value="0" max="1" hidden></progress>
    <div class="row">
      <button type="button" id="offline-cancel">Close</button>
      <button type="button" id="offline-go" class="primary">Download</button>
    </div>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
